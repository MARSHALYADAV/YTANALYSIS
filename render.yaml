services:
  - type: web
    name: ytanalysis
    runtime: python
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: YOUTUBE_API_KEY
        sync: false          # You will paste this in Render dashboard
      - key: GEMINI_API_KEY
        sync: false          # You will paste this in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: DB_PATH
        value: data/youtube.db
      - key: PYTHON_VERSION
        value: "3.11.0"
